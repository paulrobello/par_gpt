[project]
name = "par_gpt"
dynamic = [
    "version",
]
description = "Par Gpt"
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [
    { name = "Paul Robello", email = "probello@gmail.com" },
]
maintainers = [
    { name = "Paul Robello", email = "probello@gmail.com" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Other Audience",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = [
    "ai",
    "langchain",
    "openai",
    "anthropic",
    "ollama",
    "llamacpp",
    "cli",
    "llm",
]
dependencies = [
    "beautifulsoup4>=4.15.0",
    "google-api-python-client>=2.202.0",
    "google-auth-httplib2>=0.4.4",
    "google-auth-oauthlib>=1.5.0",
    "html2text>=2025.4.15",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.4",
    "langchain-experimental>=0.4.2",
    "langchain-google-community[drive,gmail]>=5.1.1",
    "langchain-groq>=1.2.1",
    "langchain-openai>=1.8.5",
    "langchain>=1.5.2",
    "langgraph>=1.2.24",
    "pandas>=3.1.1",
    "prompt-toolkit>=3.0.53",
    "pydantic-core>=2.50.5",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "orjson>=3.13.0",
    "typer>=0.29.2",
    "git-python>=1.0.3",
    "pathspec>=1.1.1",
    "numpy>=2.5.5",
    "matplotlib>=3.11.2",
    "faker>=40.54.0",
    "rich-pixels>=3.0.1",
    "keyring>=25.7.0",
    "pygithub>=2.10.0",
    "clipman>=3.3.3",
    "pyfiglet>=1.0.4",
    "sixel>=0.2.0",
    "strenum>=0.5.0",
    "feedparser>=6.0.14",
    "docker>=7.2.0",
    "restrictedpython>=9.0",
    "pyautogui>=0.9.54",
    "pywinctl>=0.4.1",
    "opencv-python>=5.1.0.95",
    "textual-image>=0.14.4",
    "pyobjc>=13.0 ; platform_system == \"Darwin\"",
    "toml>=0.10.2",
    "tomli-w>=1.2.0",
    "redis>=8.1.0",
    "langchain-neo4j>=0.11.0",
    "tinify>=1.9.0",
    "langchain-mcp-adapters>=0.3.2",
    # Keep non-lockfile installs on the patched SDK line supported by the adapter.
    "mcp>=1.30.0,<2",
    "cryptography>=50.0.2",
    "pydantic-settings>=2.16.3",
    "langchain-classic>=1.0.8",
    "par-ai-core>=0.5.9",
]
packages = [
    "src/par_gpt",
    "src/par_utils",
    "src/sandbox",
]

# Optional TTS backend dependencies. These are imported lazily by
# ``par_gpt.tts_manager`` (and audio playback in ``speak``) and are not required
# for the core CLI. Install via ``pip install par-gpt[tts]`` to enable TTS.
[project.optional-dependencies]
tts = [
    "pyttsx3>=2.99",
    "elevenlabs>=2.79.0",
    "kokoro-onnx>=0.6.1",
    "sounddevice>=0.5.6",
]

[project.license]
file = "LICENSE"

[project.urls]
Homepage = "https://github.com/paulrobello/par_gpt"
Documentation = "https://github.com/paulrobello/par_gpt/blob/main/README.md"
Repository = "https://github.com/paulrobello/par_gpt"
Issues = "https://github.com/paulrobello/par_gpt/issues"
Discussions = "https://github.com/paulrobello/par_gpt/discussions"
Wiki = "https://github.com/paulrobello/par_gpt/wiki"

[project.scripts]
par_gpt = "par_gpt.__main__:app"

[build-system]
requires = [
    "hatchling>=1.33.0",
]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "build>=1.6.1",
    "pyright>=1.1.414",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "types-orjson>=3.6.2",
    "docutils-stubs>=0.0.22",
    "pyinstrument>=5.1.3",
]

[tool.hatch.version]
path = "src/par_gpt/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = [
    "src/par_gpt",
    "src/par_utils",
    "src/sandbox",
]
include = [
    "py.typed",
    "**/*.py",
    "**/*.html",
    "**/*.gif",
    "**/*.jpg",
    "**/*.png",
    "**/*.md",
    "**/*.tcss",
    "**/*.onnx",
    "**/*.json",
    "**/*.yml",
    "**/Dockerfile",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/par_gpt",
    "src/par_utils",
    "src/sandbox",
    "LICENSE",
    "README.md",
    "pyproject.toml",
]
exclude = [
    "*.pyc",
    "__pycache__",
    "*.so",
    "*.dylib",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
python_files = [
    "test_*.py",
]
python_classes = [
    "Test*",
]
python_functions = [
    "test_*",
]
addopts = [
    "-ra",
]
