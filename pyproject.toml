[project]
name = "par_gpt"
dynamic = [
    "version",
]
description = "Par Gpt"
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [
    { name = "Paul Robello", email = "probello@gmail.com" },
]
maintainers = [
    { name = "Paul Robello", email = "probello@gmail.com" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Other Audience",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = [
    "ai",
    "langchain",
    "openai",
    "anthropic",
    "ollama",
    "llamacpp",
    "cli",
    "llm",
]
dependencies = [
    "beautifulsoup4>=4.15.0",
    "google-api-python-client>=2.198.0",
    "google-auth-httplib2>=0.4.0",
    "google-auth-oauthlib>=1.4.0",
    "html2text>=2025.4.15",
    "langchain-community>=0.4.2",
    "langchain-core>=1.4.9",
    "langchain-experimental>=0.4.2",
    "langchain-google-community[drive,gmail]>=5.0.0",
    "langchain-groq>=0.2.0",
    "langchain-openai>=1.3.5",
    "langchain>=1.3.13",
    "langgraph>=1.2.9",
    "pandas>=3.0.3",
    "prompt-toolkit>=3.0.52",
    "pydantic-core>=2.46.4",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "orjson>=3.11.9",
    "typer>=0.26.8",
    "git-python>=1.0.3",
    "pathspec>=1.1.1",
    "numpy>=2.5.1",
    "matplotlib>=3.11.0",
    "faker>=40.28.1",
    "rich-pixels>=3.0.1",
    "keyring>=25.7.0",
    "pygithub>=2.9.1",
    "clipman>=3.3.3",
    "pyfiglet>=1.0.4",
    "sixel>=0.2.0",
    "strenum>=0.4.15",
    "feedparser>=6.0.12",
    "docker>=7.2.0",
    "restrictedpython>=8.4",
    "pyautogui>=0.9.54",
    "pywinctl>=0.4.1",
    "opencv-python>=5.0.0.93",
    "textual-image>=0.13.2",
    "pyobjc>=12.2.1 ; platform_system == \"Darwin\"",
    "toml>=0.10.2",
    "tomli-w>=1.2.0",
    "redis>=8.0.1",
    "langchain-neo4j>=0.10.0",
    "tinify>=1.7.2",
    "langchain-mcp-adapters>=0.3.0",
    "cryptography>=49.0.0",
    "pydantic-settings>=2.14.2",
    "langchain-classic>=1.0.8",
    "par-ai-core>=0.5.9",
]
packages = [
    "src/par_gpt",
    "src/par_utils",
    "src/sandbox",
]

# Optional TTS backend dependencies. These are imported lazily by
# ``par_gpt.tts_manager`` (and audio playback in ``speak``) and are not required
# for the core CLI. Install via ``pip install par-gpt[tts]`` to enable TTS.
[project.optional-dependencies]
tts = [
    "pyttsx3>=2.91",
    "elevenlabs>=1.0.0",
    "kokoro-onnx>=0.4.0",
    "sounddevice>=0.5.0",
]

[project.license]
file = "LICENSE"

[project.urls]
Homepage = "https://github.com/paulrobello/par_gpt"
Documentation = "https://github.com/paulrobello/par_gpt/blob/main/README.md"
Repository = "https://github.com/paulrobello/par_gpt"
Issues = "https://github.com/paulrobello/par_gpt/issues"
Discussions = "https://github.com/paulrobello/par_gpt/discussions"
Wiki = "https://github.com/paulrobello/par_gpt/wiki"

[project.scripts]
par_gpt = "par_gpt.__main__:app"

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "build>=1.5.1",
    "pyright>=1.1.411",
    "pre-commit>=4.6.0",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.21",
    "types-orjson>=3.6.2",
    "docutils-stubs>=0.0.22",
    "pyinstrument>=5.1.2",
]

[tool.hatch.version]
path = "src/par_gpt/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = [
    "src/par_gpt",
    "src/par_utils",
    "src/sandbox",
]
include = [
    "py.typed",
    "**/*.py",
    "**/*.html",
    "**/*.gif",
    "**/*.jpg",
    "**/*.png",
    "**/*.md",
    "**/*.tcss",
    "**/*.onnx",
    "**/*.json",
    "**/*.yml",
    "**/Dockerfile",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/par_gpt",
    "src/par_utils",
    "src/sandbox",
    "LICENSE",
    "README.md",
    "extraction_prompt.md",
    "pyproject.toml",
]
exclude = [
    "*.pyc",
    "__pycache__",
    "*.so",
    "*.dylib",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-ra"]
